services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: zencitizen-mcp-server:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  mcp-server-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: zencitizen-mcp-server:dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    profiles:
      - dev
